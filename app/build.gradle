plugins {
    id 'com.android.application'
}

android {
    namespace 'jp.comitto.nxz'
    compileSdk 35

    defaultConfig {
        applicationId "jp.comitto.nxz"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Manifest のプレースホルダー定義
        manifestPlaceholders = [
            icon: "@android:drawable/sym_def_app_icon",
            roundIcon: "@android:drawable/sym_def_app_icon",
            app_name: "ComittoNxZ",
            app_launch_name: "ComittoNxZ"
        ]

        // 不足している文字列リソースを自動生成
        resValue "string", "app_name", "ComittoNxZ"
        resValue "string", "app_launch_name", "ComittoNxZ"
        resValue "string", "application_id", "jp.comitto.nxz"

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_ARM_MODE=arm",
                          "-DAVIF_CODEC_DAV1D=OFF",
                          "-DAVIF_BUILD_APPS=OFF",
                          "-DAVIF_BUILD_TESTS=OFF",
                          "-DAVIF_LIBYUV=OFF"
            }
        }

        ndk {
            abiFilters "arm64-v8a", "x86_64", "armeabi-v7a", "x86"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/jni/CMakeLists.txt"
            version "3.22.1"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'com.github.aakira:expandable-layout:1.6.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}