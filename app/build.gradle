plugins {
    id 'com.android.application'
}

android {
    // RクラスおよびBuildConfig生成用パッケージ名（ソースコード内の参照に合わせる）
    namespace 'com.github.mikotomaniax.comittonxz'
    compileSdk 35

    defaultConfig {
        applicationId "jp.comitto.nxz"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // BuildConfig に定義する動的・リソース定数
        buildConfigField "long", "BUILD_DATE", "${System.currentTimeMillis()}L"
        buildConfigField "int", "icon", "com.github.mikotomaniax.comittonxz.R.drawable.icon"

        // Manifest のプレースホルダー定義
        manifestPlaceholders = [
            icon: "@android:drawable/sym_def_app_icon",
            roundIcon: "@android:drawable/sym_def_app_icon",
            app_name: "ComittoNxZ",
            app_launch_name: "ComittoNxZ"
        ]

        // 不足している文字列リソースを自動生成
        resValue "string", "app_name", "ComittoNxZ"
        resValue "string", "app_launch_name", "ComittoNxZ"
        resValue "string", "application_id", "jp.comitto.nxz"

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_ARM_MODE=arm",
                          "-DAVIF_CODEC_DAV1D=OFF",
                          "-DAVIF_BUILD_APPS=OFF",
                          "-DAVIF_BUILD_TESTS=OFF",
                          "-DAVIF_LIBYUV=OFF",
                          "-DJPEGXL_ENABLE_SJPEG=OFF",
                          "-DJPEGXL_ENABLE_BENCHMARK=OFF",
                          "-DJPEGXL_ENABLE_EXAMPLES=OFF",
                          "-DJPEGXL_ENABLE_MANPAGES=OFF",
                          "-DJPEGXL_ENABLE_TOOLS=OFF",
                          "-DJPEGXL_ENABLE_JPEGLI=OFF",
                          "-DJPEGXL_ENABLE_DOXYGEN=OFF",
                          "-DJPEGXL_ENABLE_TESTS=OFF",
                          "-DJPEGXL_ENABLE_DEV=OFF",
                          "-DBUILD_TESTING=OFF"
            }
        }

        ndk {
            abiFilters "arm64-v8a", "x86_64", "armeabi-v7a", "x86"
        }
    }

    buildFeatures {
        // AGP 8.0以降で BuildConfig の自動生成を有効化
        buildConfig = true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/jni/CMakeLists.txt"
            version "3.22.1"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

dependencies {
    // AndroidX & UI ライブラリ
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'com.github.cachapa:ExpandableLayout:2.9.2'

    // ユーティリティ・解析系外部ライブラリ
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'org.jsoup:jsoup:1.16.1'
    implementation 'commons-io:commons-io:2.11.0'
    implementation 'com.github.albfernandez:juniversalchardet:2.4.0'

    // 7z / SMB / ePub 解析用リモート依存関係（Maven Central 公式・標準構成）
    implementation 'net.sf.sevenzipjbinding:sevenzipjbinding:16.02-2.01'
    implementation 'net.sf.sevenzipjbinding:sevenzipjbinding-all-platforms:16.02-2.01'
    implementation 'org.codelibs:jcifs:2.1.35'
    implementation ('io.documentnode:epub4j-core:4.2.1') {
        exclude group: 'xmlpull', module: 'xmlpull'
    }

    // app/libs フォルダ内のローカル jar/aar ファイル一括読み込み
    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])

    // Lombok (アノテーションプロセッサ設定)
    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'

    // テストライブラリ
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}